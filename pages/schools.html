<header class="site-header">
  <div class="header-main">
    <a href="../index.html" class="brand">
      <div class="brand-logo">保</div>
      <div class="brand-text">
        <h1>保研信息聚合库</h1>
        <p>独立项目 · 真实可校验</p>

<main class="page-main">
  <div class="page-header">
    <h1>433 所教育部官方名单</h1>
  </div>

  <!-- 顶部统计 -->
  <div class="trust-stats" style="margin-bottom:24px;">
  </div>

  <!-- 4 维筛选 -->
  <div class="filter-bar">
    <div class="filter-group">
      <label>学校层次</label>
      <div class="filter-pills" data-filter-group="tier">
        <button class="filter-pill active" data-value="all">全部 (9)</button>
        <button class="filter-pill" data-value="c9">C9 (4)</button>
        <button class="filter-pill" data-value="t985">985 (3)</button>
        <button class="filter-pill" data-value="t211">211 (2)</button>
        <button class="filter-pill" data-value="abroad">中外合办 (0)</button>
      </div>
    </div>
    <div class="filter-group">
      <label>保研率</label>
      <div class="filter-pills" data-filter-group="baoyan">
        <button class="filter-pill active" data-value="all">全部</button>
        <button class="filter-pill" data-value="40+">40%+</button>
        <button class="filter-pill" data-value="30+">30-40%</button>
        <button class="filter-pill" data-value="20+">20-30%</button>
        <button class="filter-pill" data-value="-20">20%以下</button>
      </div>
    </div>
    <div class="filter-group">
      <label>英语门槛</label>
      <div class="filter-pills" data-filter-group="english">
        <button class="filter-pill active" data-value="all">全部</button>
        <button class="filter-pill" data-value="550">六级 550+</button>
        <button class="filter-pill" data-value="520">六级 520+</button>
        <button class="filter-pill" data-value="500">六级 500+</button>
        <button class="filter-pill" data-value="ielts">雅思 7+</button>
      </div>
    </div>
    <div class="filter-group">
      <label>所在地</label>
      <div class="filter-pills" data-filter-group="region">
        <button class="filter-pill active" data-value="all">全部</button>
        <button class="filter-pill" data-value="北京">北京 (3)</button>
        <button class="filter-pill" data-value="上海">上海 (2)</button>
        <button class="filter-pill" data-value="江浙">江浙 (1)</button>
        <button class="filter-pill" data-value="中西部">中西部 (3)</button>
      </div>
    </div>
  </div>

  <!-- 院校列表 -->
  <div class="info-table">
    <table>
      <thead>
        <tr>
          <th style="width:160px;" scope="col">院校</th>
          <th style="width:80px;" scope="col">所在地</th>
          <th style="width:60px;" scope="col">层次</th>
          <th style="width:80px;" scope="col">保研率</th>
          <th style="width:100px;" scope="col">英语门槛</th>
          <th style="width:60px;" scope="col">夏令营</th>
          <th style="width:60px;" scope="col">预推免</th>
          <th style="width:90px;" scope="col">留学认可</th>
          <th style="width:60px;" scope="col">源</th>
        </tr>
      </thead>
      <tbody id="school-tbody"></tbody>
    </table>
  </div>

  <div class="load-more" style="text-align:center; padding:24px; color:var(--color-text-tertiary); font-size:13px;">
    📍 已显示 9 所 · 完整 433 所院校名单待持续收录 · 欢迎 <a href="mailto:baoyan-kb@example.com" style="color:var(--color-xdf-green);">提交数据</a>
  </div>
