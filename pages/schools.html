      <button class="search-trigger">🔍 搜院校 Ctrl+K</button>

<main id="main-content" class="page-main">
  <div class="page-header">
    <h1>保研院校 · <span id="school-count">433</span> 所</h1>
    <p class="page-desc">教育部官方名单 · 2025 年新增 67 所 · 31 个地区覆盖</p>
  </div>

  <!-- 搜索框 -->
  <div class="search-bar">
    <input type="search" id="school-search" placeholder="搜院校（如 清华 / 北大 / 复旦）" class="search-input">
    <span class="search-hint">实时过滤</span>
  </div>

  <!-- 4 维筛选（动态渲染：tier/region）-->
  <div class="filter-bar">
    <div class="filter-group">
      <label>学校层次</label>
      <div class="filter-pills" data-filter-group="tier">
        <!-- 动态生成 -->
      </div>
    </div>
    <div class="filter-group">
      <label>所在地</label>
      <div class="filter-pills" data-filter-group="region">
        <!-- 动态生成 -->
      </div>
    </div>
  </div>

  <!-- 排序 -->
  <div class="result-bar">
    <div class="result-stats">
      共 <b id="school-total">433</b> 所 · 已显示前 <b id="school-showing">100</b> 所
    </div>
    <div class="result-sort" data-sort-group>
      <span>排序：</span>
      <button class="sort-btn active" data-sort="region">按地区</button>
      <button class="sort-btn" data-sort="name">按名称</button>
      <button class="sort-btn" data-sort="tier">按层次</button>
    </div>
  </div>

  <!-- 院校列表 -->
  <div class="info-table">
    <table>
      <thead>
        <tr>
          <th style="width:200px;" scope="col">院校</th>
          <th style="width:100px;" scope="col">所在地</th>
          <th style="width:80px;" scope="col">层次</th>
          <th style="width:80px;" scope="col">查看</th>
        </tr>
      </thead>
      <tbody id="school-tbody">
        <tr><td colspan="4" class="text-muted text-center">加载中...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="load-more" style="text-align:center; padding:24px;">
    <button id="school-load-more" class="btn btn-primary btn-sm" style="display:none;">加载更多</button>
    <div style="color:var(--color-text-tertiary); font-size:13px; margin-top:8px;">
      📍 已显示前 <span id="school-showing">0</span> 所 · 完整 433 所 · 欢迎 <a href="mailto:baoyan-kb@example.com" style="color:var(--color-xdf-green);">提交数据</a>
    </div>
  </div>
</main>
