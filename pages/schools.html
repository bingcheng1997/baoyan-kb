<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保研院校 · 433 所教育部官方名单</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../styles-additions.css">
<link rel="stylesheet" href="../styles-home.css">
<link rel="stylesheet" href="../styles-pages.css">
</head>
<body>

<header class="site-header">
  <div class="header-main">
    <a href="../index.html" class="brand">
      <div class="brand-logo">保</div>
      <div class="brand-text">
        <h1>保研信息聚合库</h1>
        <p>独立项目 · 真实可校验</p>
      </div>
    </a>
    <div class="header-actions">
      <button class="search-trigger">🔍 搜院校 Ctrl+K</button>
    </div>
  </div>
  <nav class="main-nav">
    <button class="nav-toggle" aria-label="菜单">☰</button>
    <div class="main-nav-inner">
      <a href="../index.html" class="main-nav-item">首页</a>
      <a href="notices.html" class="main-nav-item">保研通知</a>
      <a href="schools.html" class="main-nav-item active">保研院校</a>
      <a href="intro.html" class="main-nav-item">保研通识</a>
      <a href="interview.html" class="main-nav-item">面试指南</a>
    </div>
  </nav>
</header>

<main class="page-main">
  <div class="page-header">
    <h1>保研院校 · <span id="school-count">433</span> 所</h1>
    <p class="page-desc">教育部官方名单 · 2025 年新增 67 所 · 31 个地区覆盖</p>
  </div>

  <!-- 搜索框 -->
  <div class="search-bar">
    <input type="search" id="school-search" placeholder="搜院校（如 清华 / 北大 / 复旦）" class="search-input">
    <span class="search-hint">实时过滤</span>
  </div>

  <!-- 4 维筛选（动态渲染：tier/region）-->
  <div class="filter-bar">
    <div class="filter-group">
      <label>学校层次</label>
      <div class="filter-pills" data-filter-group="tier">
        <!-- 动态生成 -->
      </div>
    </div>
    <div class="filter-group">
      <label>所在地</label>
      <div class="filter-pills" data-filter-group="region">
        <!-- 动态生成 -->
      </div>
    </div>
  </div>

  <!-- 排序 -->
  <div class="result-bar">
    <div class="result-stats">
      共 <b id="school-total">433</b> 所 · 已显示前 <b id="school-showing">100</b> 所
    </div>
    <div class="result-sort" data-sort-group>
      <span>排序：</span>
      <button class="sort-btn active" data-sort="region">按地区</button>
      <button class="sort-btn" data-sort="name">按名称</button>
      <button class="sort-btn" data-sort="tier">按层次</button>
    </div>
  </div>

  <!-- 院校列表 -->
  <div class="info-table">
    <table>
      <thead>
        <tr>
          <th style="width:200px;" scope="col">院校</th>
          <th style="width:100px;" scope="col">所在地</th>
          <th style="width:80px;" scope="col">层次</th>
          <th style="width:80px;" scope="col">查看</th>
        </tr>
      </thead>
      <tbody id="school-tbody">
        <tr><td colspan="4" class="text-muted text-center">加载中...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="load-more" style="text-align:center; padding:24px; color:var(--color-text-tertiary); font-size:13px;">
    📍 已显示前 100 <条 · 完整 433 所 ·欢迎 <a href="mailto:baoyan-kb@example.com" style="color:var(--color-xdf-green);">提交数据</a>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <div>保研信息聚合库 · 2026</div>
    <div>独立学术项目 · 内容仅供参考</div>
    <div>© 2026 · ICP 备案申请中</div>
  </div>
</footer>

<script src="../data/schools-data.js"></script>
<script src="../data/nav.js"></script>
<script src="../data/schools-page.js"></script>
</body>
</html>
