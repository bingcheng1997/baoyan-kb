<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保研通知 · 全国高校保研通知汇总</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../styles-additions.css">
<link rel="stylesheet" href="../styles-home.css">
<link rel="stylesheet" href="../styles-pages.css">
</head>
<body>

<header class="site-header">
  <div class="header-main">
    <a href="../index.html" class="brand">
      <div class="brand-logo">保</div>
      <div class="brand-text">
        <h1>保研信息聚合库</h1>
        <p>独立项目 · 真实可校验</p>
      </div>
    </a>
    <div class="header-actions">
      <button class="search-trigger">🔍 搜 Ctrl+K</button>
    </div>
  </div>
  <nav class="main-nav">
    <button class="nav-toggle" aria-label="菜单">☰</button>
    <div class="main-nav-inner">
      <a href="../index.html" class="main-nav-item">首页</a>
      <a href="notices.html" class="main-nav-item active">保研通知</a>
      <a href="schools.html" class="main-nav-item">保研院校</a>
      <a href="intro.html" class="main-nav-item">保研通识</a>
      <a href="interview.html" class="main-nav-item">面试指南</a>
    </div>
  </nav>
</header>

<main class="page-main">
  <div class="page-header">
    <h1>全国高校保研通知汇总</h1>
  </div>

  <!-- 5 维筛选 -->
  <div class="filter-bar">
    <div class="filter-group">
      <label>招生类型</label>
      <div class="filter-pills" data-filter-group="type">
        <button class="filter-pill active" data-value="all">全部</button>
        <button class="filter-pill" data-value="summer">夏令营</button>
        <button class="filter-pill" data-value="prerecommend">预推免</button>
        <button class="filter-pill" data-value="formal">正式推免</button>
      </div>
    </div>
    <div class="filter-group">
      <label>状态</label>
      <div class="filter-pills" data-filter-group="status">
        <button class="filter-pill active" data-value="all">全部</button>
        <button class="filter-pill" data-value="today">今天截止</button>
        <button class="filter-pill" data-value="urgent">3天截止</button>
        <button class="filter-pill" data-value="signup">报名中</button>
        <button class="filter-pill" data-value="ended">已结束</button>
      </div>
    </div>
    <div class="filter-group">
      <label>学校层次</label>
      <div class="filter-pills" data-filter-group="tier">
        <button class="filter-pill active" data-value="all">全部</button>
        <button class="filter-pill" data-value="c9">C9</button>
        <button class="filter-pill" data-value="t985">985</button>
        <button class="filter-pill" data-value="t211">211</button>
      </div>
    </div>
  </div>

  <!-- 排序 + 统计 -->
  <div class="result-bar">
    <div class="result-stats">
      共 <b id="result-total">0</b> 条 · 第 <b id="result-page">1</b> 页 / 共 <b id="result-pages">1</b> 页
    </div>
    <div class="result-sort">
      <span>排序：</span>
      <button class="sort-btn active" data-sort="deadline">按截止</button>
      <button class="sort-btn" data-sort="school">按学校</button>
      <button class="sort-btn" data-sort="latest">最新</button>
    </div>
  </div>

  <!-- 通知表格 -->
  <div class="notice-table-wrap">
    <table class="notice-table-full">
      <thead>
        <tr>
          <th style="width:90px;" scope="col">状态</th>
          <th scope="col">学校 · 院系</th>
          <th scope="col">通知标题</th>
          <th style="width:90px;" scope="col">截止</th>
          <th style="width:120px;" scope="col">操作</th>
        </tr>
      </thead>
      <tbody id="notice-tbody"></tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <div>保研信息聚合库 · 2026</div>
    <div>独立学术项目 · 内容仅供参考</div>
    <div>© 2026 · ICP 备案申请中</div>
  </div>
</footer>

<script src="../data/notices-data.js"></script>
<script src="../data/nav.js"></script>
<script src="../data/notices-page.js"></script>
</body>
</html>
